name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The build runs in the E2E workflow. The name stays because branch protection
    # requires this check by name.
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Knip loads drizzle.config.ts, which reads DATABASE_URL at load time but never
      # connects.
      - name: Create environment file
        run: cp .env.example .env.local

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Check formatting, lint, and types
        run: vp check

      - name: Find unused code and dependencies
        run: vp run knip

      - name: Find unused production code and dependencies
        run: vp run knip:production

      - name: Run tests
        run: vp test --passWithNoTests
